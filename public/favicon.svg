<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pink" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ef83ac"/><stop offset="1" stop-color="#be376a"/>
    </linearGradient>
    <mask id="eye">
      <rect width="512" height="512" fill="white"/>
      <ellipse cx="256" cy="162" rx="6" ry="15" fill="black"/>
    </mask>
  </defs>
  <!-- HILO (detrás): horizontal atravesando el ojo = travesaño de la T, con rulo a la derecha -->
  <path d="M150,168 Q202,156 256,162 Q324,168 350,156 C378,144 378,108 353,110 C335,112 340,134 358,129"
        fill="none" stroke="#f7b2d2" stroke-width="8" stroke-linecap="round"/>
  <!-- AGUJA (encima) = palo vertical de la T, con el ojo calado -->
  <path d="M247,140 Q256,128 265,140 L259,432 Q256,486 253,432 Z"
        fill="url(#pink)" mask="url(#eye)"/>
</svg>
